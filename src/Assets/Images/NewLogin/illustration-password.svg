<svg width="632" height="260" viewBox="0 0 632 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Password recovery, animated (6s loop): password dots type in, the field turns green, the padlock opens and the shield ticks. Line art matching the other auth illustrations. Animation stops for prefers-reduced-motion (final state shown). -->
  <style>
    .dot{transform-box:fill-box;transform-origin:center;animation:pop 6s ease-out infinite both}
    .field{animation:field 6s ease-in-out infinite}
    .shackle{animation:unlock 6s ease-in-out infinite}
    .tick{stroke-dasharray:48;animation:draw 6s ease-in-out infinite}
    .caret{animation:blink 1s steps(2,start) infinite}
    .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}
    @keyframes pop{0%,3%{transform:scale(0);opacity:0}8%,82%{transform:scale(1);opacity:1}90%,100%{transform:scale(0);opacity:0}}
    @keyframes field{0%,50%{stroke:#6B7280}58%,84%{stroke:#16A34A}92%,100%{stroke:#6B7280}}
    @keyframes unlock{0%,52%{transform:translateY(0)}60%,84%{transform:translateY(-12px)}92%,100%{transform:translateY(0)}}
    @keyframes draw{0%,56%{stroke-dashoffset:48}66%,84%{stroke-dashoffset:0}94%,100%{stroke-dashoffset:48}}
    @keyframes blink{to{visibility:hidden}}
    @keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1);opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g stroke="#6B7280" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 252H624"/>
    <!-- shield with tick -->
    <path d="M120 86L156 100V132C156 156 140 170 120 178C100 170 84 156 84 132V100Z"/>
    <path class="tick" d="M104 132L116 144L138 118" stroke="#16A34A" stroke-width="2"/>
    <!-- sign-in card -->
    <rect x="196" y="78" width="250" height="150" rx="14"/>
    <circle cx="222" cy="104" r="10"/>
    <path d="M242 98H320M242 110H290"/>
    <path d="M218 136H282"/>
    <rect class="field" x="216" y="146" width="210" height="40" rx="8"/>
    <rect x="216" y="200" width="210" height="14" rx="7"/>
    <!-- padlock -->
    <path class="shackle" d="M486 98V82C486 62 522 62 522 82V98"/>
    <rect x="474" y="98" width="60" height="50" rx="10"/>
    <circle cx="504" cy="118" r="6"/>
    <path d="M504 124V134"/>
    <!-- key -->
    <circle cx="520" cy="212" r="12"/>
    <circle cx="520" cy="212" r="4"/>
    <path d="M532 212H584M572 212V221M580 212V219"/>
    <!-- plant -->
    <path d="M58 252L54 228H80L76 252"/>
    <path d="M67 228C66 212 60 204 50 198M67 228C68 210 74 202 84 196M67 228V188"/>
  </g>
  <!-- password dots -->
  <g fill="#1E45E1">
    <circle class="dot" cx="238" cy="166" r="5" style="animation-delay:.2s"/>
    <circle class="dot" cx="258" cy="166" r="5" style="animation-delay:.45s"/>
    <circle class="dot" cx="278" cy="166" r="5" style="animation-delay:.7s"/>
    <circle class="dot" cx="298" cy="166" r="5" style="animation-delay:.95s"/>
    <circle class="dot" cx="318" cy="166" r="5" style="animation-delay:1.2s"/>
    <circle class="dot" cx="338" cy="166" r="5" style="animation-delay:1.45s"/>
    <circle class="dot" cx="358" cy="166" r="5" style="animation-delay:1.7s"/>
    <circle class="dot" cx="378" cy="166" r="5" style="animation-delay:1.95s"/>
  </g>
  <path class="caret" d="M396 156V176" stroke="#1E45E1" stroke-width="1.6" stroke-linecap="round"/>
  <!-- sparkles -->
  <g stroke="#1E45E1" stroke-width="1.4" stroke-linecap="round">
    <path class="spark" d="M462 48V60M456 54H468"/>
    <path class="spark" d="M176 60V70M171 65H181" style="animation-delay:1.2s"/>
    <path class="spark" d="M560 160V170M555 165H565" style="animation-delay:2s"/>
  </g>
</svg>
